name: Production Deployment

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# ── Deny all permissions by default; jobs grant only what they need ──────────
permissions:
  contents: read

env:
  DOCKER_ORG: africanalyzer
  APP_NAME: intelligence_analyzer
  APP_DIR: /opt/intelligence-analyzer

jobs:
  # ── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Least privilege for test job

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_afric
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir \
            -r requirements/requirements.txt \
            -r requirements/requirements-dev.txt

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
          ADMIN_KEY: 4BltQka5aJ_EHKPvdf0zP_7eEyR7aETtSxW5X-ZMqJMVszhcaWqgFcmPoPkLDGf7
          DATABASE_URL: postgresql://test:test@localhost:5432/test_afric  # FIX: was missing, caused all 21 ERRORs
        run: pytest tests/ -v --cov=src --cov-report=xml

      - name: Security scan (SAST + dependencies)
        run: |
          pip install bandit safety
          bandit -r src/ -f json -o bandit-report.json || true
          safety scan --output json > safety-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            coverage.xml


  # ── Job 2: Build & Push ────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to Security tab
      packages: write
    outputs:
      short_sha: ${{ steps.short_sha.outputs.sha }}
      image_ref: ${{ steps.build.outputs.imageid }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: short_sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/${{ env.APP_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ── Trivy: direct binary install ───────────────────────────────────────
      # FIX: aquasecurity/trivy-action tags were force-pushed by attackers on
      # 2026-03-01 and again on 2026-03-19. Never use that action again.
      # Instead: download the binary directly from GitHub Releases and verify
      # the SHA-256 checksum before execution. This is immune to tag tampering.
      # - name: Install Trivy binary (checksum-verified)
      #   env:
      #     TRIVY_VERSION: "0.69.1"   # Pin to known-safe version; NOT 0.69.4 (malicious)
      #   run: |
      #     curl -sSLO \
      #       "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      #     curl -sSLO \
      #       "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz.sha256"
      #     # Abort immediately if checksum does not match
      #     sha256sum --check "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz.sha256"
      #     tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
      #     sudo mv trivy /usr/local/bin/trivy
      #     rm -f "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
      #           "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz.sha256"
      #     trivy --version   # Confirm install succeeded

      ## ANother 

      # - name: Install Trivy binary (checksum-verified)
      #   env:
      #     TRIVY_VERSION: "0.69.1"
      #   run: |
      #     # Trivy publishes ONE combined checksums file for all artifacts —
      #     # not individual .sha256 files. Download both, then grep for the
      #     # specific artifact line before passing to sha256sum --check.
      #     curl -sSLO \
      #       "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      #     curl -sSLO \
      #       "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"

      #     # Extract only the line for the file we downloaded, then verify.
      #     # sha256sum --check fails if the hash doesn't match — deploy is blocked.
      #     grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
      #       "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum --check

      #     tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
      #     sudo mv trivy /usr/local/bin/trivy

      #     # Cleanup — don't leave tarballs on the runner
      #     rm -f "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
      #           "trivy_${TRIVY_VERSION}_checksums.txt"

      #     trivy --version

      - name: Install Trivy binary (checksum-verified)
        env:
          TRIVY_VERSION: "0.69.3"
          # SHA256 sourced directly from GitHub Releases API asset digest field
          # for trivy_0.69.3_Linux-64bit.tar.gz — immutable, hardcoded intentionally
          TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
        run: |
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          curl -sSLO \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TARBALL}"

          # Compute actual hash and compare directly — no checksums.txt to parse
          ACTUAL=$(sha256sum "${TARBALL}" | awk '{print $1}')
          echo "Expected : ${TRIVY_SHA256}"
          echo "Actual   : ${ACTUAL}"

          if [ "${ACTUAL}" != "${TRIVY_SHA256}" ]; then
            echo "CHECKSUM MISMATCH — binary may be compromised, aborting"
            exit 1
          fi
          echo "Checksum OK"

          tar -xzf "${TARBALL}" trivy
          sudo mv trivy /usr/local/bin/trivy
          rm -f "${TARBALL}"
          trivy --version




      - name: Scan image for vulnerabilities
        id: trivy_scan
        env:
          IMAGE: ${{ env.DOCKER_ORG }}/${{ env.APP_NAME }}:sha-${{ steps.short_sha.outputs.sha }}
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            "${IMAGE}"
        # exit-code 0 = warn only. Change to 1 to block deploys on CVEs.

      - name: Upload Trivy results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Upload Trivy scan to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4   # FIX: v3 deprecated Dec 2026 → use v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        # hashFiles guard prevents the "Path does not exist" cascade failure
        # if the scan step itself is ever skipped or errors out
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: ${{ env.DOCKER_ORG }}/${{ env.APP_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json


  # ── Job 3: Deploy ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.PROD_HOST }}" ]        && MISSING="${MISSING} PROD_HOST"
          [ -z "${{ secrets.PROD_USER }}" ]        && MISSING="${MISSING} PROD_USER"
          [ -z "${{ secrets.PROD_SSH_KEY }}" ]     && MISSING="${MISSING} PROD_SSH_KEY"
          [ -z "${{ secrets.DOCKER_USERNAME }}" ]  && MISSING="${MISSING} DOCKER_USERNAME"
          [ -z "${{ secrets.DOCKER_PASSWORD }}" ]  && MISSING="${MISSING} DOCKER_PASSWORD"
          [ -n "${MISSING}" ] && echo "Missing secrets:${MISSING}" && exit 1
          echo "All secrets present."

      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:              ${{ secrets.PROD_HOST }}
          username:          ${{ secrets.PROD_USER }}
          key:               ${{ secrets.PROD_SSH_KEY }}
          port:              22
          source:            "docker-compose.yml"
          target:            "/opt/intelligence-analyzer/"
          strip_components:  1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHORT_SHA:      ${{ needs.build.outputs.short_sha }}
          DOCKER_ORG_ENV: ${{ env.DOCKER_ORG }}
          APP_NAME_ENV:   ${{ env.APP_NAME }}
          # FIX: credentials moved to env + envs — NEVER interpolate secrets
          # directly inside script: with ${{ }}. That embeds the plaintext value
          # into the script string before it is sent over SSH.
          DOCKER_USER:    ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS:    ${{ secrets.DOCKER_PASSWORD }}
        with:
          host:        ${{ secrets.PROD_HOST }}
          username:    ${{ secrets.PROD_USER }}
          key:         ${{ secrets.PROD_SSH_KEY }}
          port:        22
          envs:        SHORT_SHA,DOCKER_ORG_ENV,APP_NAME_ENV,DOCKER_USER,DOCKER_PASS
          script_stop: true
          timeout:     300s
          script: |
            # NEVER use set -x here — it prints every variable to the log,
            # including DOCKER_PASS and any other env vars.
            set -e
            set -o pipefail

            IMAGE_TAG="sha-${SHORT_SHA}"
            APP_DIR="/opt/intelligence-analyzer"
            COMPOSE_FILE="${APP_DIR}/docker-compose.yml"
            ENV_FILE="${APP_DIR}/config/.env.production"

            echo "========================================"
            echo "  Deploying: ${DOCKER_ORG_ENV}/${APP_NAME_ENV}:${IMAGE_TAG}"
            echo "  Time:      $(date -u)"
            echo "========================================"

            echo ">> Step 1: ensure directories exist"
            mkdir -p "${APP_DIR}/docker" "${APP_DIR}/logs" "${APP_DIR}/config" "${APP_DIR}/reports"

            echo ">> Step 2: verify compose file arrived"
            if [ ! -f "${COMPOSE_FILE}" ]; then
              echo "ERROR: compose file not found at ${COMPOSE_FILE}"
              exit 1
            fi
            echo ">> Compose file OK"

            echo ">> Step 3: write runtime .env (non-secret values only)"
            # Secrets (POSTGRES_PASSWORD, HMAC_KEY, etc.) must already exist
            # on the server at ${ENV_FILE} — never write them here.
            cat > "${APP_DIR}/.env" <<EOF
            IMAGE_TAG=${IMAGE_TAG}
            DOCKER_ORG=${DOCKER_ORG_ENV}
            APP_NAME=${APP_NAME_ENV}
            DEPLOY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            EOF

            echo ">> Step 4: docker login"
            # FIX: credentials arrive as env vars (not interpolated literals).
            # --password-stdin ensures the password never appears in ps output.
            echo "${DOCKER_PASS}" | docker login -u "${DOCKER_USER}" --password-stdin

            echo ">> Step 4b: ensure shared network exists"
            docker network inspect afric-shared-network > /dev/null 2>&1 || \
              docker network create \
                --driver bridge \
                --subnet 172.22.0.0/24 \
                afric-shared-network

            echo ">> Step 4c: graceful shutdown of existing stack"
            docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" \
              down --remove-orphans --timeout 30 || true
            # NO network prune — that would delete afric-shared-network

            echo ">> Step 5: pull new image"
            IMAGE_TAG="${IMAGE_TAG}" docker compose \
              -f "${COMPOSE_FILE}" \
              --env-file "${ENV_FILE}" \
              pull

            echo ">> Step 6: bring stack up"
            IMAGE_TAG="${IMAGE_TAG}" docker compose \
              -f "${COMPOSE_FILE}" \
              --env-file "${ENV_FILE}" \
              up -d --force-recreate --remove-orphans

            echo ">> Step 7: waiting 45s for app to start..."
            sleep 45

            echo ">> Step 8: health check (12 attempts × 10s = 2 min budget)"
            HEALTHY=false
            for i in $(seq 1 12); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Host: dashboard.africanalyzer.com" \
                http://localhost:8000/health/live 2>/dev/null)
              echo ">> Attempt ${i}/12 - HTTP ${HTTP_CODE}"
              if [ "${HTTP_CODE}" = "200" ]; then
                HEALTHY=true
                echo ">> Health check passed on attempt ${i}"
                break
              fi
              sleep 10
            done

            if [ "${HEALTHY}" = "true" ]; then
              echo "========================================"
              echo "  DEPLOYMENT SUCCESSFUL"
              echo "========================================"
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" ps
            else
              echo "========================================"
              echo "  DEPLOYMENT FAILED"
              echo "========================================"
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" logs --tail=80
              exit 1
            fi

            echo ">> Cleaning up old images (safe — never prunes networks or volumes)..."
            docker image prune -f
            docker logout
            echo ">> Done."


  # ── Job 4: Deployment Summary ──────────────────────────────────────────────
  notify:
    name: Deployment Summary
    needs: [test, build, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Write job summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Repo** | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | sha-${{ needs.build.outputs.short_sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests** | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deploy** | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u) |" >> $GITHUB_STEP_SUMMARY
